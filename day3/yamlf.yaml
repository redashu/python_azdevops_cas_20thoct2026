# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml
# script is actual place to run your commands 


trigger:
- main

pool:
  name: Default
steps:
- script: python3 --version 
  displayName: 'checking python version'

- script: pytest -v  test_hello.py
  displayName: 'Running Unit testing by Pytest'  

- script: |
      mkdir -p "$(Build.ArtifactStagingDirectory)/output"
      python3 main.py
    displayName: 'Run Python application'
    continueOnError: false

- task: CopyFiles@2
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)'
    Contents: '**/*.json'
    TargetFolder: '$(Build.ArtifactStagingDirectory)/output'
  displayName: 'Collect JSON output'

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/output'
    artifact: 'python-output'
    publishLocation: 'pipeline'
  displayName: 'Publish pipeline artifact'


